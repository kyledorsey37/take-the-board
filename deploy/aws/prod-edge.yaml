AWSTemplateFormatVersion: '2010-09-09'
Description: Take the Board production ALB, target group, and regional WAF.

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-z0-9-]+$'
  TargetPort:
    Type: Number
    Default: 8000
  GlobalRateLimit:
    Type: Number
    Default: 2000
  CertificateArn:
    Type: String

Resources:
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'takeboard-${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-AlbSecurityGroup'
      Subnets:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetA'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetB'
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb'
        - Key: Project
          Value: take-the-board
        - Key: Environment
          Value: !Ref EnvironmentName

  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'takeboard-${EnvironmentName}-web'
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      TargetType: ip
      Port: !Ref TargetPort
      Protocol: HTTP
      HealthCheckEnabled: true
      HealthCheckPath: /healthz/
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-targets'
        - Key: Project
          Value: take-the-board
        - Key: Environment
          Value: !Ref EnvironmentName

  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'takeboard-${EnvironmentName}-web-acl'
      Scope: REGIONAL
      Description: !Sub 'Take the Board ${EnvironmentName} ALB protection'
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'takeboard-${EnvironmentName}-web-acl'
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedCommonRules
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'takeboard-${EnvironmentName}-common-rules'
            SampledRequestsEnabled: true
        - Name: GlobalRateLimit
          Priority: 20
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref GlobalRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub 'takeboard-${EnvironmentName}-global-rate-limit'
            SampledRequestsEnabled: true
      Tags:
        - Key: Project
          Value: take-the-board
        - Key: Environment
          Value: !Ref EnvironmentName

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref ApplicationLoadBalancer
      WebACLArn: !GetAtt WebACL.Arn

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

Outputs:
  LoadBalancerArn:
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub '${EnvironmentName}-LoadBalancerArn'
  LoadBalancerDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-LoadBalancerDnsName'
  TargetGroupArn:
    Value: !Ref ApplicationTargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-TargetGroupArn'
  WebACLArn:
    Value: !GetAtt WebACL.Arn
    Export:
      Name: !Sub '${EnvironmentName}-WebACLArn'
  HttpsListenerArn:
    Value: !Ref HttpsListener
    Export:
      Name: !Sub '${EnvironmentName}-HttpsListenerArn'
