services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TAKEBOARD_DEV_DOMAIN: ${TAKEBOARD_DEV_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./staticfiles:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    image: ${TAKEBOARD_IMAGE}
    restart: unless-stopped
    env_file:
      - ${TAKEBOARD_ENV_FILE:-.env}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ${TAKEBOARD_IMAGE}
    restart: unless-stopped
    env_file:
      - ${TAKEBOARD_ENV_FILE:-.env}
    command: python manage.py run_bid_worker --poll-seconds=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ${TAKEBOARD_ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
