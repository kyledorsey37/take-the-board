<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Staff verification</title></head><body><main><h1>Staff verification</h1>
{% if device %}<p>Scan this authenticator setup URI, then enter the current code:</p><p><code>{{ device.config_url }}</code></p>{% endif %}{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<label for="token">Authenticator code</label><input id="token" name="token" inputmode="numeric" autocomplete="one-time-code" required><button type="submit">Verify</button></form></main></body></html>
