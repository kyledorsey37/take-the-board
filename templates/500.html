{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ error_code }} | Take the Board</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="error-page-body">
  <main class="error-page">
    <a class="error-brand" href="/">Take the Board</a>
    <p class="error-code" aria-hidden="true">{{ error_code }}</p>
    <p class="eyebrow">{{ error_label }}</p>
    <h1>{{ error_title }}</h1>
    <p class="error-message">{{ error_message }}</p>
    <div class="error-actions">
      <a class="button button-primary" href="/">Back to the boards</a>
      <a class="text-link" href="/">Return home</a>
    </div>
    {% if request_id %}<p class="error-reference">Reference: {{ request_id }}</p>{% endif %}
  </main>
</body>
</html>
