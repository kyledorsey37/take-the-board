<section
  class="stripe-checkout-panel"
  data-stripe-checkout
  data-client-secret="{{ checkout_client_secret }}"
  data-status-url="{{ bid_status_url }}"
  data-analytics-school-slug="{{ board.entity.slug }}"
  data-analytics-amount-bucket="{{ amount_bucket }}"
  aria-labelledby="stripe-checkout-title"
>
  <header class="stripe-checkout-header">
    <div>
      <p class="eyebrow">Secure checkout</p>
      <h3 id="stripe-checkout-title">Confirm your takeover.</h3>
    </div>
    <form method="dialog">
      <button class="icon-button" type="submit" aria-label="Close checkout">&times;</button>
    </form>
  </header>
  <div data-stripe-checkout-mount></div>
</section>
