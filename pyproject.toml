[project]
name = "take-the-board"
version = "0.1.0"
description = "Django monolith for Take the Board."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6.0",
  "Pillow>=11.0,<12",
  "boto3>=1.34,<2",
  "django-unfold>=0.102,<1.0",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "sentry-sdk>=2,<3",
  "stripe>=11,<15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
