name: Security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Secret and dependency checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install security tools
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-security.txt

      - name: Scan repository for secrets
        env:
          GITLEAKS_DOCKER_IMAGE: ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
        run: ./scripts/scan_secrets.sh

      - name: Audit pinned dependencies
        run: ./scripts/audit_dependencies.sh
